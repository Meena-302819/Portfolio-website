<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Reports</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.report-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.report-card{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.report-card h2{
color:#2563eb;
margin-top:10px;
}

table{
margin-top:30px;
width:100%;
border-collapse:collapse;
background:white;
}

table th{
background:#2563eb;
color:white;
padding:12px;
}

table td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}

.low{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Inventory</h2>

<ul>
<li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
<li><a href="/products"><i class="fas fa-box"></i> Products</a></li>
<li><a href="/add-product"><i class="fas fa-plus"></i> Add Product</a></li>
<li><a href="/categories"><i class="fas fa-tags"></i> Categories</a></li>
<li><a href="/suppliers"><i class="fas fa-truck"></i> Suppliers</a></li>
<li><a href="/reports"><i class="fas fa-chart-line"></i> Reports</a></li>
<li><a href="/login"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
</ul>

</div>

<div class="main">

<header>
<h1>Inventory Reports</h1>
</header>

<div class="report-container">

<div class="report-card">
<h3>Total Products</h3>
<h2 id="totalProducts">0</h2>
</div>

<div class="report-card">
<h3>Total Stock</h3>
<h2 id="totalStock">0</h2>
</div>

<div class="report-card">
<h3>Inventory Value</h3>
<h2 id="inventoryValue">₹0</h2>
</div>

<div class="report-card">
<h3>Low Stock Items</h3>
<h2 id="lowStock">0</h2>
</div>

</div>

<h2 style="margin-top:30px;">Low Stock Report</h2>

<table>

<thead>
<tr>
<th>Product ID</th>
<th>Product Name</th>
<th>Quantity</th>
<th>Status</th>
</tr>
</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<script>

window.onload=function(){

loadReport();

};

async function loadReport(){

let response=await fetch("/api/reports");

let data=await response.json();

document.getElementById("totalProducts").innerHTML=data.totalProducts;

document.getElementById("totalStock").innerHTML=data.totalStock;

document.getElementById("inventoryValue").innerHTML="₹"+data.inventoryValue;

document.getElementById("lowStock").innerHTML=data.lowStock;

let table=document.getElementById("reportTable");

table.innerHTML="";

data.products.forEach(product=>{

if(product.quantity<=5){

table.innerHTML+=`

<tr>

<td>${product.product_id}</td>

<td>${product.product_name}</td>

<td>${product.quantity}</td>

<td class="low">Low Stock</td>

</tr>

`;

}

});

}

</script>

</body>
</html>
