<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

background:#0f172a;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-box{

width:400px;

background:#1e293b;

padding:40px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.4);

text-align:center;

}

.login-box h2{

margin-bottom:30px;

color:#38bdf8;

}

.login-box input{

width:100%;

padding:15px;

margin:15px 0;

border:none;

border-radius:8px;

background:#334155;

color:white;

font-size:16px;

}

.login-box button{

width:100%;

padding:15px;

border:none;

border-radius:8px;

background:#38bdf8;

color:white;

font-size:18px;

cursor:pointer;

}

.login-box button:hover{

background:#0284c7;

}

</style>

</head>

<body>

<div class="login-box">

<h2>

<i class="fas fa-user-shield"></i>

Admin Login

</h2>

<form action="/admin">

<input
type="text"
placeholder="Username"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">

<i class="fas fa-sign-in-alt"></i>

Login

</button>

</form>

</div>

</body>

</html>
