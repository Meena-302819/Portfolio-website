<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Poppins,sans-serif;
}

.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.card i{
    font-size:45px;
    color:#38bdf8;
    margin-bottom:20px;
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

.card h1{
    color:#22c55e;
    font-size:40px;
}

.buttons{
    text-align:center;
    margin-top:40px;
}

.btn{
    display:inline-block;
    padding:15px 30px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:10px;
    margin:10px;
}

.btn:hover{
    background:#0284c7;
}

</style>

</head>

<body>

<div class="container">

<h1>Portfolio Admin Dashboard</h1>

<div class="cards">

<div class="card">

<i class="fas fa-eye"></i>

<h2>Total Visitors</h2>

<h1>{{ visitors }}</h1>

</div>

<div class="card">

<i class="fas fa-envelope"></i>

<h2>Contact Messages</h2>

<h1>{{ messages }}</h1>

</div>

</div>

<div class="buttons">

<a href="/messages" class="btn">

<i class="fas fa-envelope-open-text"></i>

View Messages

</a>

<a href="/" class="btn">

<i class="fas fa-home"></i>

Back Home

</a>

</div>

</div>

</body>

</html>
